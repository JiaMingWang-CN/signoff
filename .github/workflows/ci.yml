name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare Linux command sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          if command -v aa-status >/dev/null && sudo aa-status --enabled; then
            sudo install -m 644 deploy/apparmor-bwrap /etc/apparmor.d/signoff-bwrap
            sudo apparmor_parser -r /etc/apparmor.d/signoff-bwrap
          fi
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade 'pip>=26.2.0'
          .venv/bin/python -m pip install -r requirements.txt
      - name: Run tests
        working-directory: backend
        run: .venv/bin/python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build (typecheck + vite build)
        working-directory: frontend
        run: npm run build

  # The local dev .env holds real secrets and is gitignored; scan history so
  # an accidental `git add -f` never ships a key to a public repo.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
