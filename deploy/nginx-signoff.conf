limit_req_zone $binary_remote_addr zone=signoff_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=signoff_connections:10m;

server {
    listen 80;
    listen [::]:80;
    server_name signoff.top www.signoff.top 39.106.111.147;
    return 308 https://www.signoff.top$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name signoff.top;
    ssl_certificate /etc/nginx/ssl/signoff.top/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/signoff.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://www.signoff.top$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.signoff.top;
    ssl_certificate /etc/nginx/ssl/signoff.top/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/signoff.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 128k;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://avatars.githubusercontent.com; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self' https://github.com" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /programs/signoff/frontend/dist;
    index index.html;

    location /api/ {
        limit_req zone=signoff_api burst=30 nodelay;
        limit_req_status 429;
        limit_conn signoff_connections 30;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 360s;
    }

    location ~ /\.(?!well-known/) {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
